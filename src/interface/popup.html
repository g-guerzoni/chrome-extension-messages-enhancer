<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Message Enhancer</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="../styles/popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Message Enhancer</h1>
        <button id="settings-btn" class="icon-button" aria-label="Open settings" title="Settings">
          <span class="material-icons" aria-hidden="true">settings</span>
        </button>
      </header>

      <main>
        <div class="input-section">
          <div class="input-header">
            <label for="input-text">Original Text</label>
            <button id="clean-btn" class="icon-button" aria-label="Clear text" title="Clear text">
              <span class="material-icons" aria-hidden="true">delete</span>
            </button>
          </div>
          <textarea
            id="input-text"
            placeholder="Type or paste your message. Enter to enhance, Shift+Enter for a new line."
            aria-describedby="char-count-display"
          ></textarea>
          <div id="char-count-display" class="char-count">
            <span id="char-count">0</span>/<span id="char-limit"></span> characters
          </div>
        </div>

        <div class="options-section" role="region" aria-label="Enhancement options">
          <fieldset class="tone-selection">
            <legend>Tone</legend>
            <div class="radio-group">
              <label>
                <input type="radio" name="tone" value="neutral" checked />
                Neutral
              </label>
              <label>
                <input type="radio" name="tone" value="formal" />
                Formal
              </label>
            </div>
          </fieldset>
          <fieldset class="message-type">
            <legend>Message Type</legend>
            <div class="radio-group">
              <label>
                <input type="radio" name="type" value="message" checked />
                Message
              </label>
              <label>
                <input type="radio" name="type" value="email" />
                Email
              </label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Translation</legend>
            <div class="checkbox-group">
              <label>
                <input type="checkbox" name="translate" id="translate" />
                Translate to English
              </label>
            </div>
          </fieldset>
        </div>

        <div id="error-message" class="error-message" role="alert"></div>

        <div id="setup-notice" class="notice" hidden>
          Add your <span id="setup-provider"></span> API key to start.
          <button type="button" id="setup-settings" class="link-button">Open settings</button> ·
          <a id="setup-key-link" target="_blank" rel="noopener">Get a key</a>
        </div>

        <button id="enhance-btn" class="primary-button">
          <span class="button-text">Enhance</span>
          <div class="loading-spinner" aria-hidden="true"></div>
        </button>

        <div class="output-section" role="region" aria-label="Enhanced text output">
          <div class="output-header">
            <label for="output-text">Enhanced Text</label>
            <button id="copy-btn" class="icon-button" aria-label="Copy enhanced text to clipboard" title="Copy to Clipboard">
              <span class="material-icons" aria-hidden="true">content_copy</span>
            </button>
          </div>
          <textarea id="output-text" readonly></textarea>
        </div>

        <p class="hint">Model: <span id="model-name"></span><span id="shortcut-hint"></span></p>

        <div id="status-announcer" role="status" aria-live="polite" aria-atomic="true" class="sr-only"></div>
      </main>
    </div>
    <script src="../scripts/popup.js" type="module"></script>
  </body>
</html>
